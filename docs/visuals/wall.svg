<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="wall-title wall-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="wall-title">The wall between chip designers and the fab</title>
  <desc id="wall-desc">Chip designers (NVIDIA, Google, OpenAI with Broadcom) sit on one side of a wall, the TSMC foundry on the other, and ASML tool makers feed the fab; a design must cross the wall and then wait years for the fab to calibrate.</desc>
  <defs>
    <marker id="wall-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect id="wall-bg" width="800" height="500" fill="#f5f5f5"/>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3142">Designers on one side, the factory on the other</text>
  <text x="350" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#4f5d75">the wall</text>

  <!-- arrow first -->
  <line id="wall-asml-arrow" x1="700" y1="390" x2="700" y2="334" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#wall-arrow)"/>
  <text x="688" y="368" text-anchor="end" font-size="13" fill="#4f5d75">feed the fab</text>

  <!-- designers -->
  <rect id="wall-designers" x="30" y="90" width="270" height="240" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="50" y="122" font-size="18" font-weight="700" fill="#2d3142">Chip designers</text>
  <text x="50" y="156" font-size="16" fill="#2d3142">NVIDIA</text>
  <text x="50" y="184" font-size="16" fill="#2d3142">Google</text>
  <text x="50" y="212" font-size="16" fill="#2d3142">OpenAI with Broadcom</text>

  <!-- wall with a mail slot -->
  <rect id="wall-wall-top" x="330" y="72" width="40" height="174" fill="#4f5d75" fill-opacity="0.35" stroke="#4f5d75" stroke-width="1"/>
  <rect id="wall-wall-bottom" x="330" y="290" width="40" height="140" fill="#4f5d75" fill-opacity="0.35" stroke="#4f5d75" stroke-width="1"/>

  <!-- foundry -->
  <rect id="wall-foundry" x="410" y="90" width="370" height="240" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="430" y="122" font-size="18" font-weight="700" fill="#2d3142">Foundry: TSMC</text>
  <rect id="wall-door" x="520" y="210" width="70" height="120" rx="4" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
  <circle cx="576" cy="274" r="4" fill="#eb6c36"/>
  <g id="wall-door-label">
    <text x="606" y="262" font-size="16" font-weight="700" fill="#2d3142">Years to</text>
    <text x="606" y="284" font-size="16" font-weight="700" fill="#2d3142">calibrate</text>
  </g>

  <!-- envelope: drawn in its arrived position -->
  <g id="wall-envelope">
    <rect x="432" y="250" width="56" height="36" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
    <polyline points="432,250 460,272 488,250" fill="none" stroke="#2d3142" stroke-width="1.5"/>
  </g>

  <!-- tool makers -->
  <rect id="wall-asml" x="410" y="390" width="370" height="90" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="430" y="418" font-size="16" font-weight="700" fill="#2d3142">Tool makers: ASML</text>
  <text x="430" y="444" font-size="14" fill="#2d3142">EUV machine: about $180M</text>
  <text x="430" y="466" font-size="14" fill="#2d3142">High-NA machine: about $380-400M</text>

  <text x="30" y="420" font-size="14" fill="#4f5d75">Envelope = the finished chip design.</text>
  <text x="30" y="444" font-size="14" fill="#4f5d75">It crosses the wall, then waits.</text>
</svg>
