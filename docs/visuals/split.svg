<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="split-title split-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="split-title">One chip becomes two, and compute moves out</title>
  <desc id="split-desc">Google's eighth-generation TPU is two chips, TPU 8t for training and TPU 8i for inference, and NVIDIA's Rubin CPX is another workload-specific chip; compute is spreading from hyperscale campuses to the edge and to orbit (Suncatcher, Starcloud).</desc>
  <rect id="split-bg" width="800" height="440" fill="#f5f5f5"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3142">One chip becomes two</text>

  <g id="split-chip-train">
    <rect x="140" y="70" width="220" height="130" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="2"/>
    <rect x="170" y="62" width="12" height="8" fill="#eb6c36"/><rect x="214" y="62" width="12" height="8" fill="#eb6c36"/><rect x="258" y="62" width="12" height="8" fill="#eb6c36"/><rect x="302" y="62" width="12" height="8" fill="#eb6c36"/>
    <rect x="170" y="200" width="12" height="8" fill="#eb6c36"/><rect x="214" y="200" width="12" height="8" fill="#eb6c36"/><rect x="258" y="200" width="12" height="8" fill="#eb6c36"/><rect x="302" y="200" width="12" height="8" fill="#eb6c36"/>
    <text x="250" y="124" text-anchor="middle" font-size="24" font-weight="700" fill="#2d3142">TPU 8t</text>
    <text x="250" y="152" text-anchor="middle" font-size="16" fill="#2d3142">for training</text>
    <text x="250" y="176" text-anchor="middle" font-size="14" fill="#4f5d75">(learning)</text>
  </g>
  <g id="split-chip-infer">
    <rect x="440" y="70" width="220" height="130" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="2"/>
    <rect x="470" y="62" width="12" height="8" fill="#eb6c36"/><rect x="514" y="62" width="12" height="8" fill="#eb6c36"/><rect x="558" y="62" width="12" height="8" fill="#eb6c36"/><rect x="602" y="62" width="12" height="8" fill="#eb6c36"/>
    <rect x="470" y="200" width="12" height="8" fill="#eb6c36"/><rect x="514" y="200" width="12" height="8" fill="#eb6c36"/><rect x="558" y="200" width="12" height="8" fill="#eb6c36"/><rect x="602" y="200" width="12" height="8" fill="#eb6c36"/>
    <text x="550" y="124" text-anchor="middle" font-size="24" font-weight="700" fill="#2d3142">TPU 8i</text>
    <text x="550" y="152" text-anchor="middle" font-size="16" fill="#2d3142">for inference</text>
    <text x="550" y="176" text-anchor="middle" font-size="14" fill="#4f5d75">(answering fast)</text>
  </g>
  <text id="split-cpx-note" x="400" y="244" text-anchor="middle" font-size="14" fill="#4f5d75">NVIDIA's Rubin CPX is a second example: a chip just for very long inputs.</text>

  <text x="400" y="294" text-anchor="middle" font-size="18" font-weight="700" fill="#2d3142">And the compute is moving out</text>
  <g id="split-place-campus">
    <rect x="20" y="314" width="220" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="130" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Hyperscale campus</text>
    <text x="130" y="378" text-anchor="middle" font-size="14" fill="#4f5d75">giant data centers</text>
  </g>
  <g id="split-place-edge">
    <rect x="290" y="314" width="220" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Edge</text>
    <text x="400" y="378" text-anchor="middle" font-size="14" fill="#4f5d75">small, near the user</text>
  </g>
  <g id="split-place-orbit">
    <rect x="560" y="314" width="220" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="670" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Orbit</text>
    <text x="670" y="378" text-anchor="middle" font-size="14" fill="#4f5d75">Suncatcher, Starcloud</text>
  </g>
</svg>
