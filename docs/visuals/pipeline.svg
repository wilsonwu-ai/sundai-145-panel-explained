<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="pipeline-title pipeline-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="pipeline-title">From idea to chip: where verification takes the time</title>
  <desc id="pipeline-desc">Chip design runs from spec to RTL, verification, physical design, tape-out and fab; verification is the biggest stage at about half of project time (53 percent in the 2018 Wilson Research study), and AI agents are arriving at RTL, verification and physical design.</desc>
  <defs>
    <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect id="pipeline-bg" width="800" height="440" fill="#f5f5f5"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3142">From idea to chip</text>

  <!-- arrows -->
  <line x1="108" y1="220" x2="124" y2="220" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
  <line x1="212" y1="220" x2="228" y2="220" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
  <line x1="468" y1="220" x2="484" y2="220" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
  <line x1="572" y1="220" x2="588" y2="220" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
  <line x1="676" y1="220" x2="692" y2="220" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>

  <!-- stages -->
  <g id="pipeline-stage-spec">
    <rect x="20" y="180" width="88" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="64" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Spec</text>
  </g>
  <g id="pipeline-stage-rtl">
    <rect x="124" y="180" width="88" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="168" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">RTL</text>
  </g>
  <g id="pipeline-stage-verif">
    <rect id="pipeline-verif-box" x="228" y="160" width="240" height="120" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="2"/>
    <text x="348" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3142">Verification</text>
    <text x="348" y="234" text-anchor="middle" font-size="14" fill="#2d3142">about half of project time</text>
    <text x="348" y="258" text-anchor="middle" font-size="14" fill="#2d3142">53% (Wilson Research, 2018)</text>
  </g>
  <g id="pipeline-stage-physical">
    <rect x="484" y="180" width="88" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="528" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Physical</text>
    <text x="528" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">design</text>
  </g>
  <g id="pipeline-stage-tapeout">
    <rect x="588" y="180" width="88" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="632" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Tape-out</text>
  </g>
  <g id="pipeline-stage-fab">
    <rect x="692" y="180" width="88" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
    <text x="736" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Fab</text>
  </g>

  <!-- AI agent badges -->
  <g id="pipeline-badge-rtl">
    <rect x="128" y="146" width="80" height="24" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="168" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3142">AI agents</text>
  </g>
  <g id="pipeline-badge-verif">
    <rect x="308" y="126" width="80" height="24" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="348" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3142">AI agents</text>
  </g>
  <g id="pipeline-badge-physical">
    <rect x="488" y="146" width="80" height="24" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="528" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3142">AI agents</text>
  </g>

  <!-- track -->
  <line x1="64" y1="320" x2="736" y2="320" stroke="#bfc0c0" stroke-width="2"/>
  <circle cx="64" cy="320" r="5" fill="#7a8399"/>
  <circle cx="168" cy="320" r="5" fill="#7a8399"/>
  <circle cx="348" cy="320" r="5" fill="#7a8399"/>
  <circle cx="528" cy="320" r="5" fill="#7a8399"/>
  <circle cx="632" cy="320" r="5" fill="#7a8399"/>
  <circle cx="736" cy="320" r="5" fill="#7a8399"/>
  <circle id="pipeline-token" cx="736" cy="320" r="11" fill="#eb6c36" stroke="#2d3142" stroke-width="1"/>

  <text x="30" y="372" font-size="14" fill="#4f5d75">RTL: the circuit written as code. Verification: testing it before it is built.</text>
  <text x="30" y="396" font-size="14" fill="#4f5d75">Tape-out: sending the finished design to the factory (the fab).</text>
  <text x="30" y="420" font-size="14" fill="#4f5d75">AI agents: software helpers that are starting to show up in these steps.</text>
</svg>
