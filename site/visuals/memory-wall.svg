<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="memory-wall-title memory-wall-desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="memory-wall-title">The memory wall: adding is cheap, fetching is not</title>
  <desc id="memory-wall-desc">On a log scale, an 8-bit add costs 0.03 pJ and a 32-bit add 0.1 pJ, while a DRAM access costs 1.3 to 2.6 nJ and runs off the chart; below, a spectrum from flexible CPU and GPU to TPU to hardwired chips such as Taalas.</desc>
  <defs>
    <marker id="memory-wall-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect id="memory-wall-bg" width="800" height="520" fill="#f5f5f5"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3142">Adding is cheap. Fetching from memory is not.</text>

  <!-- gridlines (log scale, each one is ten times the last) -->
  <line x1="350" y1="64" x2="350" y2="272" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="460" y1="64" x2="460" y2="272" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="570" y1="64" x2="570" y2="272" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="680" y1="64" x2="680" y2="272" stroke="#bfc0c0" stroke-width="1"/>
  <line x1="240" y1="64" x2="240" y2="272" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="350" y="294" text-anchor="middle" font-size="13" fill="#4f5d75">0.1 pJ</text>
  <text x="460" y="294" text-anchor="middle" font-size="13" fill="#4f5d75">1 pJ</text>
  <text x="570" y="294" text-anchor="middle" font-size="13" fill="#4f5d75">10 pJ</text>
  <text x="400" y="318" text-anchor="middle" font-size="14" fill="#4f5d75">Each gridline is ten times the one before (log scale)</text>

  <!-- rows -->
  <text x="30" y="106" font-size="16" font-weight="700" fill="#2d3142">8-bit add</text>
  <rect id="memory-wall-bar-add8" x="240" y="84" width="52" height="32" fill="#4f5d75" fill-opacity="0.55" stroke="#4f5d75" stroke-width="1"/>
  <text id="memory-wall-val-add8" x="302" y="106" font-size="16" fill="#2d3142">0.03 pJ</text>

  <text x="30" y="162" font-size="16" font-weight="700" fill="#2d3142">32-bit add</text>
  <rect id="memory-wall-bar-add32" x="240" y="140" width="110" height="32" fill="#4f5d75" fill-opacity="0.55" stroke="#4f5d75" stroke-width="1"/>
  <text id="memory-wall-val-add32" x="360" y="162" font-size="16" fill="#2d3142">0.1 pJ</text>

  <text x="30" y="218" font-size="16" font-weight="700" fill="#2d3142">Fetch from DRAM</text>
  <rect id="memory-wall-bar-dram" x="240" y="196" width="520" height="32" fill="#eb6c36" stroke="#eb6c36" stroke-width="1"/>
  <g id="memory-wall-break">
    <polygon points="724,228 742,196 758,196 740,228" fill="#f5f5f5"/>
    <line x1="724" y1="228" x2="742" y2="196" stroke="#2d3142" stroke-width="1.5"/>
    <line x1="740" y1="228" x2="758" y2="196" stroke="#2d3142" stroke-width="1.5"/>
  </g>
  <text id="memory-wall-val-dram" x="240" y="254" font-size="16" font-weight="700" fill="#2d3142">1.3 to 2.6 nJ per fetch, off the chart</text>

  <!-- spectrum -->
  <text x="30" y="368" font-size="18" font-weight="700" fill="#2d3142">Flexible or fast: pick your point</text>
  <line x1="180" y1="420" x2="228" y2="420" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#memory-wall-arrow)"/>
  <line x1="380" y1="420" x2="428" y2="420" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#memory-wall-arrow)"/>
  <line x1="580" y1="420" x2="628" y2="420" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#memory-wall-arrow)"/>
  <g id="memory-wall-spec-cpu">
    <rect x="30" y="392" width="150" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="105" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">CPU</text>
  </g>
  <g id="memory-wall-spec-gpu">
    <rect x="230" y="392" width="150" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="305" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">GPU</text>
  </g>
  <g id="memory-wall-spec-tpu">
    <rect x="430" y="392" width="150" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="505" y="426" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">TPU</text>
  </g>
  <g id="memory-wall-spec-hardwired">
    <rect x="630" y="392" width="150" height="56" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="2"/>
    <text x="705" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#2d3142">Hardwired</text>
    <text x="705" y="436" text-anchor="middle" font-size="13" fill="#2d3142">(Taalas)</text>
  </g>
  <text x="30" y="472" font-size="13" fill="#4f5d75">most flexible</text>
  <text x="780" y="472" text-anchor="end" font-size="13" fill="#4f5d75">fastest, but fixed</text>
  <text x="30" y="504" font-size="13" fill="#4f5d75">Energy numbers: Horowitz, ISSCC 2014 (45nm chips).</text>
</svg>
